  <rect x="2" y="2" width="956" height="176" rx="28" fill="url(#bg)" stroke="#f5c518" stroke-opacity="0.5" stroke-width="4"/>
  <rect x="2" y="2" width="956" height="176" rx="28" fill="url(#glow)"/>
  <g transform="translate(48 20)" filter="url(#shadow)">
    <path d="M57 3c29 0 45 23 37 52-5 18-18 36-33 54l19 28-25 15-17-27-18 27-25-15 20-29C20 89 7 71 3 54-4 25 12 3 41 3h16Zm-7 19c-12 0-19 11-15 24 3 12 11 24 22 38 10-14 18-27 21-39 3-13-4-23-16-23H50Z" fill="url(#ribbon)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fffdf5">
    <text x="184" y="58" font-size="37" font-weight="800" letter-spacing="2.4">SETEMBRO AMARELO</text>
    <text x="184" y="104" font-size="30" font-weight="700">Se precisar, peça ajuda.</text>
