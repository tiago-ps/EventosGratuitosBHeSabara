<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">Setembro Amarelo — Se precisar, peça ajuda. CVV 188.</title>
  <desc id="desc">Banner amarelo e dourado sobre fundo escuro, com mensagem de apoio emocional gratuito vinte e quatro horas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b08"/>
      <stop offset="0.58" stop-color="#211d09"/>
      <stop offset="1" stop-color="#151308"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.78">
      <stop offset="0" stop-color="#ffe27a" stop-opacity="0.45"/>
      <stop offset="0.42" stop-color="#f5c518" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#d6a900"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
