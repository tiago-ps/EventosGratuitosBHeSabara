name: Corrigir visibilidade dos perfis editoriais

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-visibilidade-perfis-editoriais.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aplicar correção
        run: python scripts/corrigir_visibilidade_perfis_editoriais.py

      - name: Validar JavaScript
        run: node --check js/app.js

      - name: Validar regressão
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F '.filter(editorialProfileIsVisible)' js/app.js
          grep -F '.filter(profile => editorialProfileIsVisible(profile))' js/app.js >/dev/null
          grep -F "'agosto-lilas-2026'" js/app.js >/dev/null
          grep -F 'js/app.js?v=83' index.html >/dev/null
          grep -F 'mural-cultural-v91-perfil-editorial-visivel' service-worker.js >/dev/null
          git diff --check

      - name: Salvar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js scripts/integrar_perfis_editoriais.py index.html service-worker.js
          if git diff --cached --quiet; then
            echo 'Correção já aplicada.'
            exit 0
          fi
          git commit -m 'fix(painel): corrige visibilidade do perfil Agosto Lilás [skip ci]'
          git push
