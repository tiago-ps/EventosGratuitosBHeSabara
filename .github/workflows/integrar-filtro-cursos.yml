name: Integrar filtro temático de cursos

on:
  push:
    branches:
      - main
    paths:
      - 'js/conteudos/cursos.js'
      - 'scripts/integrar_filtro_cursos.py'
      - '.github/workflows/integrar-filtro-cursos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Versionar módulo e cache
        run: python scripts/integrar_filtro_cursos.py

      - name: Validar JavaScript
        run: node --check js/conteudos/cursos.js

      - name: Salvar integração
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(cursos): publica filtro temático v2 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
