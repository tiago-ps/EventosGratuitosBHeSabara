name: Validar filtros do modo Exploração

on:
  push:
    branches: [main]
    paths:
      - "js/app.js"
      - "js/painel-navegacao-modos.js"
      - "js/tema-visual-boot.js"
      - "js/conteudos/cursos.js"
      - "js/conteudos/concursos.js"
      - "js/conteudos/filmes.js"
      - "js/conteudos/atividades-lazer.js"
      - "js/conteudos/espacos.js"
      - "css/styles.css"
      - "index.html"
      - "service-worker.js"
      - "livros.json"
      - "cursos.json"
      - "concursos.json"
      - "filmes.json"
      - "atividades-lazer.json"
      - "utilidade-publica.json"
      - "espacos_culturais.json"
      - "testes/filtros-exploracao-completos.test.cjs"
      - "testes/cabecalho-exploracao.test.cjs"
      - "testes/filmes-catalogo.test.cjs"
      - "testes/atividades-lazer-agenda.test.cjs"
      - "testes/concursos-agenda.test.cjs"
      - "testes/cursos-agenda.test.cjs"
      - ".github/workflows/validar-filtros-exploracao.yml"
  pull_request:
    paths:
      - "js/app.js"
      - "js/painel-navegacao-modos.js"
      - "js/tema-visual-boot.js"
      - "js/conteudos/cursos.js"
      - "js/conteudos/concursos.js"
      - "js/conteudos/filmes.js"
      - "js/conteudos/atividades-lazer.js"
      - "js/conteudos/espacos.js"
      - "css/styles.css"
      - "index.html"
      - "service-worker.js"
      - "livros.json"
      - "cursos.json"
      - "concursos.json"
      - "filmes.json"
      - "atividades-lazer.json"
      - "utilidade-publica.json"
      - "espacos_culturais.json"
      - "testes/filtros-exploracao-completos.test.cjs"
      - "testes/cabecalho-exploracao.test.cjs"
      - "testes/filmes-catalogo.test.cjs"
      - "testes/atividades-lazer-agenda.test.cjs"
      - "testes/concursos-agenda.test.cjs"
      - "testes/cursos-agenda.test.cjs"
      - ".github/workflows/validar-filtros-exploracao.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validar sintaxe
        run: |
          node --check js/app.js
          node --check js/painel-navegacao-modos.js
          node --check js/tema-visual-boot.js
          node --check js/conteudos/cursos.js
          node --check js/conteudos/concursos.js
          node --check js/conteudos/filmes.js
          node --check js/conteudos/atividades-lazer.js
          node --check js/conteudos/espacos.js
          node --check service-worker.js
      - name: Validar filtros
        run: |
          node testes/filtros-exploracao-completos.test.cjs
          node testes/cabecalho-exploracao.test.cjs
          node testes/cursos-agenda.test.cjs
          node testes/concursos-agenda.test.cjs
          node testes/atividades-lazer-agenda.test.cjs
          node testes/filmes-catalogo.test.cjs
