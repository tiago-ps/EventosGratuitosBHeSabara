name: Comparar site de teste com público

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/comparar-site-publico.yml'

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar site de teste
        uses: actions/checkout@v6

      - name: Baixar site público
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/BibliotecaIFMGSabara/MuralCultural.git /tmp/mural-publico

      - name: Comparar dados e arquivos ativos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          test = Path('.').resolve()
          public = Path('/tmp/mural-publico').resolve()
          self_path = '.github/workflows/comparar-site-publico.yml'

          def inventory(root):
              out = {}
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root).as_posix()
                  if rel == self_path or rel.startswith('.git/'):
                      continue
                  h = hashlib.sha256(path.read_bytes()).hexdigest()
                  out[rel] = (h, path.stat().st_size)
              return out

          a = inventory(test)
          b = inventory(public)
          different = sorted(path for path in set(a) & set(b) if a[path][0] != b[path][0])

          def choose_id(item):
              if not isinstance(item, dict):
                  return None
              for key in ('id', 'id_fonte', 'fonte_id', 'codigo', 'titulo'):
                  value = item.get(key)
                  if value not in (None, ''):
                      return str(value)
              return None

          def semantic_json(name):
              left = json.loads((test / name).read_text(encoding='utf-8'))
              right = json.loads((public / name).read_text(encoding='utf-8'))
              out = {'file': name}
              if isinstance(left, dict) and isinstance(right, dict):
                  out['top_level_changed'] = sorted(
                      k for k in set(left) | set(right)
                      if k not in ('eventos','filmes','livros','cursos','concursos') and left.get(k) != right.get(k)
                  )
                  collection_key = next((k for k in ('eventos','filmes','livros','cursos','concursos') if isinstance(left.get(k), list) and isinstance(right.get(k), list)), None)
                  if collection_key:
                      la, ra = left[collection_key], right[collection_key]
                      li = {choose_id(x): x for x in la if choose_id(x) is not None}
                      ri = {choose_id(x): x for x in ra if choose_id(x) is not None}
                      only_left = sorted(set(li) - set(ri))
                      only_right = sorted(set(ri) - set(li))
                      changed = []
                      for key in sorted(set(li) & set(ri)):
                          if li[key] != ri[key]:
                              fields = sorted(k for k in set(li[key]) | set(ri[key]) if li[key].get(k) != ri[key].get(k))
                              changed.append({'id': key, 'fields': fields})
                      out.update({
                          'collection': collection_key,
                          'test_count': len(la),
                          'public_count': len(ra),
                          'only_test_count': len(only_left),
                          'only_public_count': len(only_right),
                          'changed_count': len(changed),
                          'only_test': only_left[:40],
                          'only_public': only_right[:40],
                          'changed': changed[:80],
                      })
              return out

          data_reports = []
          for name in ('eventos.json','livros.json','cursos.json','filmes.json','concursos.json','configuracao-mural.json'):
              if name in a and name in b:
                  data_reports.append(semantic_json(name))

          print('=== SEMANTICA_JSON_INICIO ===')
          print(json.dumps(data_reports, ensure_ascii=False, indent=2))
          print('=== SEMANTICA_JSON_FIM ===')

          print('=== DIFF_ATIVOS_INICIO ===')
          for name in ('index.html','js/app.js','js/conteudos/cursos.js','js/temas-visuais.js','service-worker.js','manifest.webmanifest'):
              if name not in a or name not in b or a[name][0] == b[name][0]:
                  continue
              print(f'--- {name} ---')
              proc = subprocess.run(
                  ['diff','-u',str(public/name),str(test/name)],
                  text=True, capture_output=True
              )
              lines = proc.stdout.splitlines()
              if len(lines) > 500:
                  lines = lines[:500] + [f'... diff truncado; total {len(proc.stdout.splitlines())} linhas ...']
              print('\n'.join(lines))
          print('=== DIFF_ATIVOS_FIM ===')
          PY
