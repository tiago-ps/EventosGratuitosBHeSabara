name: TEMP — validar Curadorias de Concursos

on:
  push:
    branches:
      - feature/curadorias-concursos

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validar JavaScript
        run: |
          node --check js/curadorias-site.js
          node --check js/app.js
      - name: Rodar testes da camada de Curadorias
        run: node testes/curadorias-site.test.cjs
