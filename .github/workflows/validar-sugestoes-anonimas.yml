name: Validar sugestões anônimas

on:
  pull_request:
    paths:
      - "cloudflare/social-preview-worker.js"
      - "cloudflare/sugestoes-curadoria.sql"
      - "cloudflare/selecoes-compartilhadas.sql"
      - "cloudflare/README-sugestoes-curadoria.md"
      - "js/app.js"
      - "css/styles.css"
      - "index.html"
      - "service-worker.js"
      - ".github/workflows/validar-sugestoes-anonimas.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validar JavaScript
        run: |
          node --check js/app.js
          node --check cloudflare/social-preview-worker.js
          node --check service-worker.js
      - name: Validar privacidade e esquema
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const worker=fs.readFileSync('cloudflare/social-preview-worker.js','utf8');
          const sql=fs.readFileSync('cloudflare/sugestoes-curadoria.sql','utf8');
          const shared=fs.readFileSync('cloudflare/selecoes-compartilhadas.sql','utf8');
          for (const forbidden of ['remoteip', 'user_agent', 'fingerprint']) {
            if (sql.toLowerCase().includes(forbidden)) throw new Error('campo persistente proibido: '+forbidden);
            if (shared.toLowerCase().includes(forbidden)) throw new Error('campo persistente proibido em links curtos: '+forbidden);
          }
          if (!worker.includes("SUGGESTION_API_PATH = '/api/sugestoes-curadoria'")) throw new Error('API ausente');
          if (!worker.includes('CURADORIA_ADMIN_TOKEN')) throw new Error('proteção administrativa ausente');
          if (!worker.includes('SUGESTOES_DAILY_LIMIT')) throw new Error('limite diário ausente');
          NODE
