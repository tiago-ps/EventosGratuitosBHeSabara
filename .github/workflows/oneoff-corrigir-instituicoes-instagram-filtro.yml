name: One-off — Corrigir instituições no filtro

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-corrigir-instituicoes-instagram-filtro.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Aplicar correção
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          text = app.read_text(encoding='utf-8')
          marker = 'const EVENT_INSTITUTION_NAMES = Object.freeze({'
          if marker not in text:
              start = text.find('function eventProgram(event) {')
              if start < 0:
                  raise SystemExit('Função eventProgram não encontrada.')
              line_start = text.rfind('\n', 0, start) + 1
              end_marker = '\n  function eventUnit(event) {'
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('Limite da função eventProgram não encontrado.')
              new = """  const EVENT_INSTITUTION_NAMES = Object.freeze({
            'ccbb-bh': 'CCBB Belo Horizonte',
            'espaco-conhecimento-ufmg': 'Espaço do Conhecimento UFMG',
            'fcs': 'Fundação Clóvis Salgado',
            'fundacao-municipal-cultura-bh': 'Fundação Municipal de Cultura de Belo Horizonte',
            'prefeitura-sabara': 'Prefeitura Municipal de Sabará',
            'Secretaria de Cultura de Sabará': 'Secretaria de Cultura de Sabará',
            'sesc-mg': 'Sesc em Minas',
            'sesiminas-bh': 'Centro Cultural SESIMINAS BH',
            'associacao-social-paroquia-santa-ines': 'Associação Social Paróquia Santa Inês'
          });

          function eventProgram(event) {
            const program = String(event?.programa || '').trim();
            if (program) return program;

            const institutionId = String(event?.instituicao_id || '').trim();
            if (institutionId && EVENT_INSTITUTION_NAMES[institutionId]) {
              return EVENT_INSTITUTION_NAMES[institutionId];
            }

            const source = String(event?.fonte || '').trim();
            if (!source || /^instagram\\s*(?:—|-|$)/i.test(source)) return '';
            return source;
          }
          """
              text = text[:line_start] + new + text[end:]
          app.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          if 'js/app.js?v=83' in text:
              text = text.replace('js/app.js?v=83', 'js/app.js?v=84')
          elif 'js/app.js?v=84' not in text:
              raise SystemExit('Versão esperada do app não encontrada no index.')
          index.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          text = sw.read_text(encoding='utf-8')
          if 'mural-cultural-v91-perfil-editorial-visivel' in text:
              text = text.replace('mural-cultural-v91-perfil-editorial-visivel', 'mural-cultural-v92-filtro-instituicoes')
          if './js/app.js?v=83' in text:
              text = text.replace('./js/app.js?v=83', './js/app.js?v=84')
          if 'mural-cultural-v92-filtro-instituicoes' not in text or './js/app.js?v=84' not in text:
              raise SystemExit('Service worker não foi atualizado corretamente.')
          sw.write_text(text, encoding='utf-8')
          PY

      - name: Validar JavaScript e catálogo atual
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path('js/app.js').read_text(encoding='utf-8')
          assert 'EVENT_INSTITUTION_NAMES' in source
          assert "event?.instituicao_id" in source
          assert "/^instagram\\s*(?:—|-|$)/i.test(source)" in source

          names = {
              'ccbb-bh': 'CCBB Belo Horizonte',
              'espaco-conhecimento-ufmg': 'Espaço do Conhecimento UFMG',
              'fcs': 'Fundação Clóvis Salgado',
              'fundacao-municipal-cultura-bh': 'Fundação Municipal de Cultura de Belo Horizonte',
              'prefeitura-sabara': 'Prefeitura Municipal de Sabará',
              'Secretaria de Cultura de Sabará': 'Secretaria de Cultura de Sabará',
              'sesc-mg': 'Sesc em Minas',
              'sesiminas-bh': 'Centro Cultural SESIMINAS BH',
              'associacao-social-paroquia-santa-ines': 'Associação Social Paróquia Santa Inês',
          }
          instagram = re.compile(r'^instagram\s*(?:—|-|$)', re.I)
          events = json.loads(Path('eventos.json').read_text(encoding='utf-8')).get('eventos', [])

          def label(event):
              program = str(event.get('programa') or '').strip()
              if program:
                  return program
              institution_id = str(event.get('instituicao_id') or '').strip()
              if institution_id in names:
                  return names[institution_id]
              source = str(event.get('fonte') or '').strip()
              if not source or instagram.search(source):
                  return ''
              return source

          options = sorted({label(event) for event in events if label(event)})
          if any(instagram.search(option) for option in options):
              raise SystemExit('Fonte Instagram ainda apareceu como instituição/programa.')
          mapped = [event for event in events if instagram.search(str(event.get('fonte') or '')) and not event.get('programa') and event.get('instituicao_id') in names]
          if not mapped:
              raise SystemExit('Nenhum evento Instagram associado a instituição foi encontrado para validar.')
          print(f'Validação concluída: {len(options)} opções e {len(mapped)} eventos Instagram associados corretamente.')
          PY
          grep -q "js/app.js?v=84" index.html
          grep -q "mural-cultural-v92-filtro-instituicoes" service-worker.js

      - name: Commitar correção
        shell: bash
        run: |
          set -euo pipefail
          git add js/app.js index.html service-worker.js
          if git diff --cached --quiet; then
            echo "Correção já aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Corrige instituições no filtro de eventos"
          git pull --rebase origin main
          git push origin HEAD:main

# disparo robusto
