name: Aplicar temas visuais

on:
  push:
    branches: [main]
    paths:
      - 'css/temas-visuais.css'
      - 'js/tema-visual-boot.js'
      - 'js/temas-visuais.js'
      - 'scripts/aplicar_temas_visuais.py'
      - '.github/workflows/aplicar-temas-visuais.yml'
      - 'imagens/curadorias/agosto-lilas-banner.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Integrar temas visuais
        run: python scripts/aplicar_temas_visuais.py

      - name: Validar JavaScript
        run: |
          node --check js/tema-visual-boot.js
          node --check js/temas-visuais.js

      - name: Salvar integração
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(ui): separa tema visual da curadoria [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
