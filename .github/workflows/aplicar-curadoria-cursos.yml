name: Aplicar curadoria temática aos cursos

on:
  push:
    branches:
      - main
    paths:
      - cursos.json
      - scripts/aplicar_curadoria_cursos.py
      - .github/workflows/aplicar-curadoria-cursos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Aplicar curadoria
        run: python scripts/aplicar_curadoria_cursos.py

      - name: Salvar alterações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cursos.json js/app.js service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(curadoria): inclui cursos no Agosto Lilás [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
