name: Ajustar ícones mobile Tem Sim Uai

on:
  push:
    branches: [main]
    paths:
      - '.github/ajustar-icones-mobile.trigger'

permissions:
  contents: write

concurrency:
  group: ajustar-icones-mobile
  cancel-in-progress: false

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reduzir lettering apenas nos ícones mobile
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          from statistics import median
          from PIL import Image

          SCALE = 0.90

          files = [
              Path('imagens/app-icons/apple-touch-icon.png'),
              Path('imagens/app-icons/icon-maskable-192.png'),
              Path('imagens/app-icons/icon-maskable-512.png'),
              Path('imagens/app-icons/apple-touch-icon-tem-sim-uai.png'),
              Path('imagens/app-icons/icon-maskable-tem-sim-uai-192.png'),
              Path('imagens/app-icons/icon-maskable-tem-sim-uai-512.png'),
          ]

          def background_color(im):
              pixels = []
              for r, g, b, a in im.getdata():
                  if a >= 245:
                      pixels.append((r, g, b))
              if not pixels:
                  return (0, 0, 0)
              # Quantização leve evita que antialiasing/ruído vença a cor do fundo.
              quant = [((r//4)*4, (g//4)*4, (b//4)*4) for r,g,b in pixels]
              return Counter(quant).most_common(1)[0][0]

          def whiteness(rgb, bg):
              vals = []
              for c, base in zip(rgb, bg):
                  den = 255 - base
                  if den >= 48:
                      vals.append(max(0.0, min(1.0, (c - base) / den)))
              return median(vals) if vals else 0.0

          def shrink_text(path):
              im = Image.open(path).convert('RGBA')
              bg = background_color(im)
              px = im.load()
              xs, ys = [], []
              for y in range(im.height):
                  for x in range(im.width):
                      r,g,b,a = px[x,y]
                      if a < 80:
                          continue
                      if whiteness((r,g,b), bg) >= 0.16:
                          xs.append(x); ys.append(y)

              if not xs:
                  raise RuntimeError(f'Não foi possível localizar o lettering em {path}')

              pad = max(2, round(min(im.size) * 0.012))
              left=max(0,min(xs)-pad); top=max(0,min(ys)-pad)
              right=min(im.width,max(xs)+pad+1); bottom=min(im.height,max(ys)+pad+1)

              crop = im.crop((left, top, right, bottom))
              # Remove o lettering antigo mantendo o fundo e a geometria do ícone.
              fill = Image.new('RGBA', (right-left, bottom-top), (*bg, 255))
              im.paste(fill, (left, top))

              nw=max(1, round(crop.width*SCALE))
              nh=max(1, round(crop.height*SCALE))
              scaled=crop.resize((nw,nh), Image.Resampling.LANCZOS)
              x=round((left+right-nw)/2)
              y=round((top+bottom-nh)/2)
              im.alpha_composite(scaled, (x,y))
              im.save(path, optimize=True)
              print(f'{path}: bg={bg}, bbox={(left,top,right,bottom)}, escala={SCALE}')

          for path in files:
              if path.exists():
                  shrink_text(path)
              else:
                  print(f'Ignorado (ausente): {path}')
          PY

      - name: Renovar referências mobile
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path('manifest.webmanifest')
          text = manifest.read_text()
          text = text.replace('icon-maskable-192.png"', 'icon-maskable-192.png?v=2"')
          text = text.replace('icon-maskable-512.png"', 'icon-maskable-512.png?v=2"')
          manifest.write_text(text)

          test_manifest = Path('imagens/app-icons/manifest-tem-sim-uai.webmanifest')
          if test_manifest.exists():
              text = test_manifest.read_text()
              text = text.replace('icon-maskable-tem-sim-uai-192.png?v=4', 'icon-maskable-tem-sim-uai-192.png?v=5')
              text = text.replace('icon-maskable-tem-sim-uai-512.png?v=4', 'icon-maskable-tem-sim-uai-512.png?v=5')
              test_manifest.write_text(text)

          index = Path('index.html')
          text = index.read_text().replace(
              'imagens/app-icons/apple-touch-icon.png"',
              'imagens/app-icons/apple-touch-icon.png?v=2"'
          )
          index.write_text(text)

          boot = Path('js/tema-visual-boot.js')
          text = boot.read_text().replace(
              'apple-touch-icon-tem-sim-uai.png?v=3',
              'apple-touch-icon-tem-sim-uai.png?v=4'
          ).replace(
              'manifest-tem-sim-uai.webmanifest?v=3',
              'manifest-tem-sim-uai.webmanifest?v=4'
          )
          boot.write_text(text)

          sw = Path('service-worker.js')
          text = sw.read_text()
          text = text.replace('mural-cultural-v128-panel-book-bulk', 'mural-cultural-v129-mobile-icons')
          text = text.replace(
              "'./imagens/app-icons/apple-touch-icon.png'",
              "'./imagens/app-icons/apple-touch-icon.png?v=2'"
          )
          sw.write_text(text)
          PY

      - name: Commitar ajuste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             imagens/app-icons/apple-touch-icon.png             imagens/app-icons/icon-maskable-192.png             imagens/app-icons/icon-maskable-512.png             imagens/app-icons/apple-touch-icon-tem-sim-uai.png             imagens/app-icons/icon-maskable-tem-sim-uai-192.png             imagens/app-icons/icon-maskable-tem-sim-uai-512.png             imagens/app-icons/manifest-tem-sim-uai.webmanifest             manifest.webmanifest index.html js/tema-visual-boot.js service-worker.js

          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
          else
            git commit -m 'fix: reduz lettering dos icones mobile do PWA [skip ci]'
            git push origin HEAD:main
          fi
