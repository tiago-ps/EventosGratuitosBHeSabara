name: Validar Utilidade Pública

on:
  pull_request:
    paths:
      - "utilidade-publica.json"
      - "js/app.js"
      - "js/conteudos/utilidade-publica.js"
      - "css/utilidade-publica.css"
      - "index.html"
      - "service-worker.js"
      - "testes/utilidade-salario-minimo.test.cjs"
      - ".github/workflows/validar-utilidade-salario-minimo.yml"
  push:
    branches:
      - "feat/integrar-salario-*"
    paths:
      - "utilidade-publica.json"
      - "js/app.js"
      - "js/conteudos/utilidade-publica.js"
      - "css/utilidade-publica.css"
      - "index.html"
      - "service-worker.js"
      - "testes/utilidade-salario-minimo.test.cjs"
      - ".github/workflows/validar-utilidade-salario-minimo.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe JavaScript
        run: |
          node --check js/app.js
          node --check js/conteudos/utilidade-publica.js
          node --check service-worker.js
      - name: Validar catálogo de Utilidade Pública
        run: node -e "const d=JSON.parse(require('fs').readFileSync('utilidade-publica.json','utf8')); if(!Array.isArray(d.itens)) process.exit(1); console.log(d.itens.length, 'itens');"
      - name: Testar visualizações
        run: node testes/utilidade-salario-minimo.test.cjs
