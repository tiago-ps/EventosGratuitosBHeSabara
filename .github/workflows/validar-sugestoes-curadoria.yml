name: Validar sugestões anônimas de curadoria

on:
  pull_request:
    paths:
      - "js/app.js"
      - "css/styles.css"
      - "cloudflare/social-preview-worker.js"
      - "cloudflare/sugestoes-curadoria.sql"
      - ".github/workflows/validar-sugestoes-curadoria.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar JavaScript
        run: |
          node --check js/app.js
          node --check cloudflare/social-preview-worker.js
          node --check service-worker.js
      - name: Validar contrato de privacidade
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const sql = fs.readFileSync('cloudflare/sugestoes-curadoria.sql','utf8');
          const worker = fs.readFileSync('cloudflare/social-preview-worker.js','utf8');
          for (const forbidden of ['ip_address','user_agent','fingerprint','email','telefone']) {
            if (sql.toLowerCase().includes(forbidden)) throw new Error('campo proibido no banco: '+forbidden);
          }
          if (worker.includes("form.append('remoteip'")) throw new Error('Turnstile não deve receber remoteip');
          for (const required of ['itens_json','protocolo','mensagem','status']) {
            if (!sql.includes(required)) throw new Error('campo esperado ausente: '+required);
          }
          console.log('contrato de privacidade ok');
          NODE
