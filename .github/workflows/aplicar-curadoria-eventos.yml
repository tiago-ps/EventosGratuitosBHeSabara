name: Aplicar curadoria temática aos eventos

on:
  push:
    branches: [main]
    paths:
      - "eventos.json"
      - "scripts/aplicar_curadoria_eventos.py"
      - ".github/workflows/aplicar-curadoria-eventos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aplicar-curadoria-eventos
  cancel-in-progress: true

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Aplicar curadoria
        run: python scripts/aplicar_curadoria_eventos.py

      - name: Salvar alterações
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(curadoria): inclui evento no Agosto Lilás [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
