name: Aplicar correção de cursos

on:
  push:
    branches:
      - fix/cursos-painel-agenda
    paths:
      - .github/workflows/aplicar-correcao-cursos.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cursos-painel-agenda
      - name: Corrigir integração dos cursos
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')

          old = """    const city = slide.querySelector('.city');
    if (city) { city.hidden = false; city.textContent = 'ONLINE'; }
"""
          new = """    const city = slide.querySelector('.city');
    if (city) {
      city.className = 'badge city course-online-badge';
      city.hidden = false;
      city.textContent = 'ONLINE';
    }
"""
          if old not in s: raise SystemExit('Trecho badge não encontrado')
          s = s.replace(old, new, 1)

          old = """    if (img) {
      img.hidden = !image;
      if (image) { img.src = image; img.alt = `Imagem: ${course.titulo || 'Curso'}`; }
    }
    if (fallback) {
      fallback.hidden = Boolean(image);
      fallback.querySelector('.fallback-icon').textContent = '🎓';
      fallback.querySelector('.fallback-label').textContent = course.instituicao || 'Curso online';
    }
"""
          new = """    if (img) {
      img.hidden = !image;
      img.style.display = image ? 'block' : 'none';
      img.classList.toggle('course-image', Boolean(image));
      if (image) {
        img.alt = `Imagem: ${course.titulo || 'Curso'}`;
        img.onload = () => {
          img.classList.add('loaded');
          if (fallback) fallback.hidden = true;
        };
        img.onerror = () => {
          img.classList.remove('loaded');
          img.style.display = 'none';
          if (fallback) fallback.hidden = false;
        };
        img.src = image;
      }
    }
    if (fallback) {
      fallback.hidden = Boolean(image);
      fallback.querySelector('.fallback-icon').textContent = '🎓';
      fallback.querySelector('.fallback-label').textContent = course.instituicao || 'Curso online';
    }
"""
          if old not in s: raise SystemExit('Trecho imagem não encontrado')
          s = s.replace(old, new, 1)

          old = """    slide.querySelector('.source-label').textContent = 'Curso online gratuito';
    slide.querySelector('.source-url').textContent = link ? new URL(link).hostname : (course.instituicao || '');
    slide.querySelector('.updated').textContent = course.area || '';
"""
          new = """    slide.querySelector('.source-label').textContent = 'Curso online gratuito';
    const courseSource = slide.querySelector('.source-url');
    if (link) {
      const anchor = document.createElement('a');
      anchor.href = link;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';
      anchor.textContent = 'Acessar página deste curso';
      courseSource.replaceChildren(anchor);
    } else {
      courseSource.textContent = course.instituicao || '';
    }
    slide.querySelector('.updated').textContent = course.area || '';
"""
          if old not in s: raise SystemExit('Trecho link não encontrado')
          s = s.replace(old, new, 1)

          old = """    controls.querySelector('.agenda-content').addEventListener('change', event => {
      state.mobileContent = event.target.value;
      const allowedThemes = new Set(agendaThemeOptions(state.mobileContent).map(([value]) => value));
      if (state.mobileTheme && !allowedThemes.has(state.mobileTheme)) state.mobileTheme = '';
      rerender();
    });
"""
          new = """    controls.querySelector('.agenda-content').addEventListener('change', event => {
      state.mobileContent = event.target.value;
      // Filtros específicos de outro módulo não podem bloquear a troca de conteúdo.
      state.mobilePeriod = 'all';
      state.mobileCategory = '';
      state.mobileCity = '';
      state.mobileSpace = '';
      state.mobileInstitution = '';
      state.mobileRegistration = '';
      state.mobileBookAccess = '';
      const allowedThemes = new Set(agendaThemeOptions(state.mobileContent).map(([value]) => value));
      if (state.mobileTheme && !allowedThemes.has(state.mobileTheme)) state.mobileTheme = '';
      rerender();
    });
"""
          if old not in s: raise SystemExit('Trecho filtro não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          css = Path('css/styles.css')
          c = css.read_text(encoding='utf-8')
          addition = """

/* Cursos no modo painel: imagem ocupa a área visual e badge ONLINE não herda estilos de cidade. */
.panel-mode .event-image.course-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
.panel-mode .badge.course-online-badge {
  display: inline-flex;
  width: auto;
  min-width: 0;
  max-width: 100%;
  white-space: nowrap;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--counter-border);
}
"""
          if 'course-online-badge' not in c:
              css.write_text(c + addition, encoding='utf-8')

      - name: Atualizar cache dos arquivos estáticos
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'css/styles\.css\?v=\d+', 'css/styles.css?v=64', s)
          s = re.sub(r'js/app\.js\?v=\d+', 'js/app.js?v=64', s)
          p.write_text(s, encoding='utf-8')
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js css/styles.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: corrigir cursos no painel e filtros da agenda"
          git push origin fix/cursos-painel-agenda
