name: Geocodificar espaços - teste
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/geocodificar-espacos.yml
      - scripts/geocodificar_espacos.py

permissions:
  contents: write

concurrency:
  group: mapa-espacos-geocodificacao
  cancel-in-progress: false

jobs:
  geocodificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Gerar coordenadas verificadas com cache e limite de consultas
        run: python3 scripts/geocodificar_espacos.py
      - name: Registrar resultados e pendências no repositório de teste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coordenadas-espacos.json pendencias-coordenadas-espacos.json
          if ! git diff --cached --quiet; then
            git commit -m "data(mapa): atualizar locais geocodificados e pendências"
            # A publicação e outros ajustes podem avançar a main durante a coleta.
            # Integra os novos commits sem sobrescrever alterações concorrentes.
            for tentativa in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 4
            done
            exit 1
          fi
