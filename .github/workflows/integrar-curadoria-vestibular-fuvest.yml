name: Integrar curadoria Vestibular FUVEST 2027

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrar_curadoria_vestibular_fuvest.py'
      - '.github/workflows/integrar-curadoria-vestibular-fuvest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aplicar curadoria Vestibular FUVEST
        run: python scripts/integrar_curadoria_vestibular_fuvest.py

      - name: Validar JSON
        run: python -m json.tool curadorias-site.json > /dev/null

      - name: Validar JavaScript
        run: |
          node --check js/app.js
          node --check service-worker.js

      - name: Testar curadoria
        run: node testes/vestibular-fuvest-curadoria.test.cjs

      - name: Conferir alterações
        run: |
          git diff --check
          git diff -- curadorias-site.json js/app.js service-worker.js testes/vestibular-fuvest-curadoria.test.cjs

      - name: Salvar integração
        shell: bash
        run: |
          if git diff --quiet -- curadorias-site.json js/app.js service-worker.js testes/vestibular-fuvest-curadoria.test.cjs; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curadorias-site.json js/app.js service-worker.js testes/vestibular-fuvest-curadoria.test.cjs
          git commit -m 'feat(curadoria): adiciona Vestibular FUVEST 2027 [skip ci]'
          git push origin main
