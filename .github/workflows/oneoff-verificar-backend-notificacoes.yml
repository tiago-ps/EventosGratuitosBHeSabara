name: One-off — Verificar backend de notificações

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-verificar-backend-notificacoes.yml"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar configuração pública de Web Push
        run: |
          set -euo pipefail
          for tentativa in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 \
              https://temsimuai.com.br/api/notificacoes/config \
              -o "$RUNNER_TEMP/notificacoes-config.json"; then
              cat "$RUNNER_TEMP/notificacoes-config.json"
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"], "notificacoes-config.json").read_text())
          assert data["disponivel"] is True
          assert isinstance(data["public_key"], str) and len(data["public_key"]) >= 80
          assert data["lembrete_dias"] == 1
          assert data["preferencias_locais"] is True
          PY
              exit 0
            fi
            sleep 10
          done
          echo "Backend de notificações ainda não respondeu corretamente."
          exit 1
