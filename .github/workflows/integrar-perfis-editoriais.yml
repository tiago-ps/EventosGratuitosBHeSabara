name: Integrar perfis editoriais do painel

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrar_perfis_editoriais.py'
      - '.github/workflows/integrar-perfis-editoriais.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrar perfil editorial
        run: python scripts/integrar_perfis_editoriais.py

      - name: Validar JavaScript
        run: node --check js/app.js

      - name: Conferir alterações
        run: |
          git diff --check
          git diff -- configuracao-mural.json js/app.js index.html service-worker.js

      - name: Salvar integração
        shell: bash
        run: |
          if git diff --quiet -- configuracao-mural.json js/app.js index.html service-worker.js; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configuracao-mural.json js/app.js index.html service-worker.js
          git commit -m 'feat(painel): adiciona perfil editorial Agosto Lilás [skip ci]'
          git push origin main
