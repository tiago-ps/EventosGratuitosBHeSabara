<!doctype html>
<html lang="pt-BR" data-theme="original">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta name="theme-color" content="#07111f">
  <meta name="application-name" content="Agenda Cultural Gratuita">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda Cultural">
  <title>Agenda Cultural Gratuita</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="imagens/app-icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="imagens/app-icons/favicon-32.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/styles.css?v=53.2">
  <link rel="stylesheet" href="css/eventos-manuais-ui.css?v=42">
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section class="loading" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando programação…</p>
    </section>
  </main>

  <template id="slide-template">
    <article class="slide" aria-roledescription="slide">
      <div class="media">
        <img class="event-image" alt="">
        <div class="image-fallback" aria-hidden="true">
          <span class="fallback-icon"></span>
          <span class="fallback-label"></span>
        </div>
        <div class="media-overlay"></div>
        
        <div class="controls" aria-label="Controles da apresentação">
          <button
            class="control-btn filter-btn"
            aria-label="Filtrar eventos"
            title="Filtrar eventos"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 5h16l-6.2 7.1v5.2l-3.6 1.8v-7L4 5Z"></path>
            </svg>
            <span class="filter-count" hidden></span>
          </button>
          <button class="control-btn prev-btn" aria-label="Slide anterior" title="Anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="navigation-counter counter" aria-label="posição do evento"></div>
          <button class="control-btn next-btn" aria-label="Próximo slide" title="Próximo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <button class="control-btn play-pause-btn" aria-label="Pausar" title="Pausar">
            <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
        </div>
      </div>

      <div class="content">
        <header class="topbar">
          <div>
            <p class="panel-title">
              <span class="panel-title-main"></span>
              <span class="panel-title-cities"></span>
            </p>
          </div>
        </header>

        <div class="event-copy">
          <div class="badges">
            <span class="badge category"></span>
            <span class="badge free">GRATUITO</span>
            <span class="badge rating" hidden></span>
            <span class="badge city" aria-hidden="true"></span>
          </div>

          <h1 class="event-title"></h1>
          <p class="description"></p>

          <dl class="details">
            <div>
              <dt>Quando</dt>
              <dd class="when"></dd>
            </div>
            <div>
              <dt>Onde</dt>
              <dd class="where">
                <span class="where-text"></span>
                <a
                  class="map-link"
                  target="_blank"
                  rel="noopener noreferrer"
                  hidden
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
                    <circle cx="12" cy="10" r="2.5"></circle>
                  </svg>
                  <span>Abrir no Google Maps</span>
                </a>
              </dd>
            </div>
            <!--
              FUNCIONALIDADE SOB ANÁLISE DE VIABILIDADE

              A caixa "Participação" foi temporariamente retirada da interface,
              pois normalmente repetia orientações de retirada ou inscrição
              gratuita já disponíveis na página oficial acessada pelo QR Code.

              Para reativar, remova este comentário e reative também o bloco
              correspondente em js/app.js e a regra em css/styles.css.

              <div class="registration-row">
                <dt>Participação</dt>
                <dd class="registration"></dd>
              </div>
            -->
          </dl>
        </div>

        <footer class="footer">
          <div class="source-block">
            <p class="source-label">Programação e inscrição</p>
            <p class="source-url"></p>
            <p class="updated"></p>
          </div>
          <div class="qr-wrap">
            <div class="qr-code" aria-label="QR Code do evento"></div>
            <span>Aponte a câmera</span>
          </div>
        </footer>
      </div>

      <div class="filter-overlay" hidden>
        <section
          class="filter-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="filter-title"
        >
          <header class="filter-header">
            <div>
              <p class="filter-eyebrow">Refinar programação</p>
              <h2 id="filter-title">Filtrar eventos</h2>
            </div>
            <button class="filter-close" type="button" aria-label="Fechar filtros" title="Fechar">×</button>
          </header>

          <div class="filter-grid">
            <label>
              <span>Cidade</span>
              <select class="filter-city">
                <option value="">Todas as cidades</option>
              </select>
            </label>

            <label>
              <span>Categoria</span>
              <select class="filter-category">
                <option value="">Todas as categorias</option>
              </select>
            </label>

            <label>
              <span>Programa ou instituição</span>
              <select class="filter-program">
                <option value="">Todos os programas</option>
              </select>
            </label>

            <label>
              <span>Espaço</span>
              <select class="filter-unit">
                <option value="">Todos os espaços</option>
              </select>
            </label>

            <label>
              <span>Período</span>
              <select class="filter-period">
                <option value="all">Todos os eventos futuros</option>
                <option value="today">Hoje</option>
                <option value="tomorrow">Amanhã</option>
                <option value="7days">Próximos 7 dias</option>
              </select>
            </label>

            <label>
              <span>Classificação indicativa</span>
              <select class="filter-rating">
                <option value="">Todas as classificações</option>
                <option value="livre">Livre</option>
                <option value="10">10 anos</option>
                <option value="12">12 anos</option>
                <option value="14">14 anos</option>
                <option value="16">16 anos</option>
                <option value="18">18 anos</option>
              </select>
            </label>
          </div>

          <div class="filter-actions">
            <button class="filter-clear" type="button">Limpar filtros</button>
            <button class="filter-apply" type="button">Aplicar filtros</button>
          </div>
        </section>
      </div>

      <div class="progress" aria-hidden="true"><span></span></div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="js/app.js?v=53.2" defer></script>
  <script src="js/eventos-manuais-ui.js?v=42" defer></script>

</body>
</html>
